<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up — InterviewAI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            <div class="logo-icon">AI</div>
            <span>Interview<span class="purple">AI</span></span>
        </div>

        <div class="nav-buttons">
            <a href="index.html" class="secondary-btn auth-nav-btn">
                Back to Home
            </a>
        </div>

    </nav>


    <!-- AUTH -->

    <section class="auth">

        <div class="auth-card">

            <span class="small-heading">GET STARTED</span>

            <h1>Create your account</h1>

            <p class="auth-subtext">
                Start practicing interviews in under a minute.
            </p>

            <form id="signupForm" novalidate>

                <div class="field">

                    <label for="name">Full name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Jordan Lee"
                        autocomplete="name"
                    >

                    <span class="field-error" id="nameError"></span>

                </div>

                <div class="field">

                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                    >

                    <span class="field-error" id="emailError"></span>

                </div>

                <div class="field">

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="At least 8 characters"
                        autocomplete="new-password"
                    >

                    <span class="field-error" id="passwordError"></span>

                </div>

                <div class="field">

                    <label for="confirmPassword">Confirm password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="••••••••"
                        autocomplete="new-password"
                    >

                    <span class="field-error" id="confirmPasswordError"></span>

                </div>

                <button type="submit" class="primary-btn auth-submit">
                    Create Account
                    <span>→</span>
                </button>

            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Log in</a>
            </p>

        </div>

    </section>

    <script src="auth.js"></script>

</body>

</html>
